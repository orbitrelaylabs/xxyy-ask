name: xxyy-ask

x-app-base: &app-base
  image: xxyy-ask:local
  build:
    context: .
  env_file:
    - .env
  environment:
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-}
    NODE_ENV: production
    KNOWLEDGE_AUTO_REFRESH_ENABLED: ${KNOWLEDGE_AUTO_REFRESH_ENABLED:-false}
    KNOWLEDGE_AUTO_REFRESH_INCREMENTAL_DAILY_AT: ${KNOWLEDGE_AUTO_REFRESH_INCREMENTAL_DAILY_AT:-08:00}
    KNOWLEDGE_AUTO_REFRESH_RECEIPT_FILE: ${KNOWLEDGE_AUTO_REFRESH_RECEIPT_FILE:-.rag/knowledge-refresh/latest.json}
    KNOWLEDGE_AUTO_REFRESH_STALE_AFTER_MINUTES: ${KNOWLEDGE_AUTO_REFRESH_STALE_AFTER_MINUTES:-1560}
    KNOWLEDGE_AUTO_REFRESH_TIME_ZONE: ${KNOWLEDGE_AUTO_REFRESH_TIME_ZONE:-Asia/Shanghai}
    OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
    OPENAI_BASE_URL: ${COMPOSE_OPENAI_BASE_URL:-${OPENAI_BASE_URL}}
    OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL in .env}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_HOST: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  init: true

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    ports:
      - '${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - xxyy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  knowledge-init:
    <<: *app-base
    command: ['node', 'scripts/bootstrap-knowledge.mjs']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *app-base
    command: ['pnpm', 'run', 'api:dev']
    restart: unless-stopped
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-}
      NODE_ENV: production
      KNOWLEDGE_AUTO_REFRESH_ENABLED: ${KNOWLEDGE_AUTO_REFRESH_ENABLED:-false}
      KNOWLEDGE_AUTO_REFRESH_INCREMENTAL_DAILY_AT: ${KNOWLEDGE_AUTO_REFRESH_INCREMENTAL_DAILY_AT:-08:00}
      KNOWLEDGE_AUTO_REFRESH_RECEIPT_FILE: ${KNOWLEDGE_AUTO_REFRESH_RECEIPT_FILE:-.rag/knowledge-refresh/latest.json}
      KNOWLEDGE_AUTO_REFRESH_STALE_AFTER_MINUTES: ${KNOWLEDGE_AUTO_REFRESH_STALE_AFTER_MINUTES:-1560}
      KNOWLEDGE_AUTO_REFRESH_TIME_ZONE: ${KNOWLEDGE_AUTO_REFRESH_TIME_ZONE:-Asia/Shanghai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_BASE_URL: ${COMPOSE_OPENAI_BASE_URL:-${OPENAI_BASE_URL}}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PORT: 3000
      API_ENABLE_DEEP_HEALTH: ${API_ENABLE_DEEP_HEALTH:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      knowledge-init:
        condition: service_completed_successfully
    ports:
      - '${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - './.rag/knowledge-refresh:/app/.rag/knowledge-refresh:ro'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  telegram:
    <<: *app-base
    command: ['pnpm', 'run', 'telegram:dev']
    restart: unless-stopped
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-}
      NODE_ENV: production
      KNOWLEDGE_AUTO_REFRESH_ENABLED: ${KNOWLEDGE_AUTO_REFRESH_ENABLED:-false}
      KNOWLEDGE_AUTO_REFRESH_INCREMENTAL_DAILY_AT: ${KNOWLEDGE_AUTO_REFRESH_INCREMENTAL_DAILY_AT:-08:00}
      KNOWLEDGE_AUTO_REFRESH_RECEIPT_FILE: ${KNOWLEDGE_AUTO_REFRESH_RECEIPT_FILE:-.rag/knowledge-refresh/latest.json}
      KNOWLEDGE_AUTO_REFRESH_STALE_AFTER_MINUTES: ${KNOWLEDGE_AUTO_REFRESH_STALE_AFTER_MINUTES:-1560}
      KNOWLEDGE_AUTO_REFRESH_TIME_ZONE: ${KNOWLEDGE_AUTO_REFRESH_TIME_ZONE:-Asia/Shanghai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_BASE_URL: ${COMPOSE_OPENAI_BASE_URL:-${OPENAI_BASE_URL}}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      HTTPS_PROXY: ${TELEGRAM_HTTPS_PROXY:-}
      HTTP_PROXY: ${TELEGRAM_HTTP_PROXY:-}
      NODE_USE_ENV_PROXY: ${TELEGRAM_NODE_USE_ENV_PROXY:-}
      NO_PROXY: ${TELEGRAM_NO_PROXY:-postgres,localhost,127.0.0.1}
      TELEGRAM_AUTO_LEARNING_CONTEXT_MESSAGES: ${TELEGRAM_AUTO_LEARNING_CONTEXT_MESSAGES:-12}
      TELEGRAM_AUTO_LEARNING_ENABLED: ${TELEGRAM_AUTO_LEARNING_ENABLED:-false}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    depends_on:
      knowledge-init:
        condition: service_completed_successfully
    volumes:
      - './.rag/knowledge-refresh:/app/.rag/knowledge-refresh:ro'

volumes:
  xxyy_pgdata:
